name: Build MAD101.g3a

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project
        shell: bash
        run: |
          zip_file="$(find . -maxdepth 1 -type f -name 'MAD101_G3A_Project*.zip' | head -n 1)"
          test -n "$zip_file"
          unzip -t "$zip_file"
          unzip -q "$zip_file"
          python3 patches/enable_quiz_review.py MAD101_G3A_Project/src/main.c
          python3 patches/add_graph_types_reference.py MAD101_G3A_Project/src/main.c
          python3 patches/add_prefix_postfix_evaluator.py MAD101_G3A_Project/src/main.c
          python3 patches/add_prefix_postfix_tips.py MAD101_G3A_Project/src/main.c
          python3 patches/add_affine_cipher_solver.py MAD101_G3A_Project/src/main.c
          python3 patches/add_base_converter.py MAD101_G3A_Project/src/main.c
          python3 patches/add_complete_bipartite_tool.py MAD101_G3A_Project/src/main.c
          python3 patches/add_merge_counter.py MAD101_G3A_Project/src/main.c
          python3 patches/add_bitstring_lcg_ui.py MAD101_G3A_Project/src/main.c
          python3 patches/show_lcg_formula_during_input.py MAD101_G3A_Project/src/main.c
          python3 patches/add_set_notation_tips.py MAD101_G3A_Project/src/main.c
          python3 patches/add_negation_guide.py MAD101_G3A_Project/src/main.c
          python3 patches/add_function_huffman_tools.py MAD101_G3A_Project/src/main.c
          python3 patches/add_tonight_quiz_summary.py MAD101_G3A_Project/src/main.c
      - name: Run host tests
        working-directory: MAD101_G3A_Project
        shell: bash
        run: |
          # The lightweight host keyboard stub predates the left/right key constants
          # used by the new string editors. Real gint already provides these keys.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/stubs/gint/keyboard.h")
          source = path.read_text(encoding="utf-8")
          if "KEY_LEFT" not in source:
              source = "#define KEY_LEFT 1001\n#define KEY_RIGHT 1002\n" + source
              path.write_text(source, encoding="utf-8")
          PY
          make -f Makefile.host test
          make -f Makefile.host syntax

  build-g3a:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore project
        shell: bash
        run: |
          zip_file="$(find . -maxdepth 1 -type f -name 'MAD101_G3A_Project*.zip' | head -n 1)"
          test -n "$zip_file"
          unzip -t "$zip_file"
          unzip -q "$zip_file"
          python3 patches/enable_quiz_review.py MAD101_G3A_Project/src/main.c
          python3 patches/add_graph_types_reference.py MAD101_G3A_Project/src/main.c
          python3 patches/add_prefix_postfix_evaluator.py MAD101_G3A_Project/src/main.c
          python3 patches/add_prefix_postfix_tips.py MAD101_G3A_Project/src/main.c
          python3 patches/add_affine_cipher_solver.py MAD101_G3A_Project/src/main.c
          python3 patches/add_base_converter.py MAD101_G3A_Project/src/main.c
          python3 patches/add_complete_bipartite_tool.py MAD101_G3A_Project/src/main.c
          python3 patches/add_merge_counter.py MAD101_G3A_Project/src/main.c
          python3 patches/add_bitstring_lcg_ui.py MAD101_G3A_Project/src/main.c
          python3 patches/show_lcg_formula_during_input.py MAD101_G3A_Project/src/main.c
          python3 patches/add_set_notation_tips.py MAD101_G3A_Project/src/main.c
          python3 patches/add_negation_guide.py MAD101_G3A_Project/src/main.c
          python3 patches/add_function_huffman_tools.py MAD101_G3A_Project/src/main.c
          python3 patches/add_tonight_quiz_summary.py MAD101_G3A_Project/src/main.c
      - name: Cache fxSDK toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
            ~/.cache/giteapc
          key: fxsdk-gint-v7-${{ runner.os }}
      - name: Install fxSDK, SuperH compiler and gint
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl pkg-config python3 python3-pil libpng-dev libusb-1.0-0-dev libudev-dev libudisks2-dev libsdl2-dev libncurses-dev
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v giteapc >/dev/null 2>&1; then
            curl -L "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" -o /tmp/giteapc-install.sh
            printf '\n' | bash /tmp/giteapc-install.sh
          fi
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v sh-elf-gcc >/dev/null 2>&1 || ! command -v fxsdk >/dev/null 2>&1; then
            printf '\n' | giteapc install Lephenixnoir/fxsdk Lephenixnoir/sh-elf-binutils Lephenixnoir/sh-elf-gcc
            printf '\n' | giteapc install Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
            printf '\n' | giteapc install Lephenixnoir/gint
          fi
          command -v sh-elf-gcc
          command -v fxsdk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build add-in
        working-directory: MAD101_G3A_Project
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Current gint names the parenthesis keys KEY_LEFTP and KEY_RIGHTP.
          sed -i 's/KEY_LPAR/KEY_LEFTP/g; s/KEY_RPAR/KEY_RIGHTP/g' src/main.c
          fxsdk build-cg
          mkdir -p ../artifact
          binary="$(find . -name 'MAD101.g3a' | head -n 1)"
          test -n "$binary"
          cp "$binary" ../artifact/MAD101.g3a
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAD101-g3a
          path: artifact/MAD101.g3a
      - name: Publish binary in repository
        shell: bash
        run: |
          mkdir -p release
          cp artifact/MAD101.g3a release/MAD101.g3a
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/MAD101.g3a
          if ! git diff --cached --quiet; then
            git commit -m "Publish MAD101.g3a negation guide [skip ci]"
            git pull --rebase origin main
            git push
          fi
