name: Export cached fxSDK toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-fxsdk-toolchain.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-fxsdk-toolchain.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the successful MAD101 fxSDK cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local
            ~/.cache/giteapc
          key: fxsdk-gint-v7-${{ runner.os }}
          fail-on-cache-miss: true

      - name: Verify and package toolchain
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v sh-elf-gcc
          command -v fxsdk
          sh-elf-gcc --version | head -n 1
          fxsdk --version || true
          tar --exclude='.local/share/giteapc' \
              --exclude='.local/state' \
              -czf fxsdk-toolchain-linux-x86_64.tar.gz \
              -C "$HOME" .local
          sha256sum fxsdk-toolchain-linux-x86_64.tar.gz > SHA256SUMS.txt
          stat -c '%s' fxsdk-toolchain-linux-x86_64.tar.gz > SIZE_BYTES.txt

      - name: Upload reusable toolchain
        uses: actions/upload-artifact@v4
        with:
          name: fxsdk-toolchain-linux-x86_64
          path: |
            fxsdk-toolchain-linux-x86_64.tar.gz
            SHA256SUMS.txt
            SIZE_BYTES.txt
          retention-days: 7

      - name: Publish public toolchain release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="fxsdk-toolchain-v1"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              fxsdk-toolchain-linux-x86_64.tar.gz \
              SHA256SUMS.txt SIZE_BYTES.txt --clobber
          else
            gh release create "$tag" \
              fxsdk-toolchain-linux-x86_64.tar.gz \
              SHA256SUMS.txt SIZE_BYTES.txt \
              --title "Cached fxSDK toolchain v1" \
              --notes "Verified Linux x86_64 fxSDK 2.11.0, sh-elf-gcc 14.1.0 and gint toolchain used to build the calculator add-ins."
          fi
